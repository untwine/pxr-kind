[build-system]
requires = [
    "scikit-build-core",
    "pxr-tf-dev==26.8.*",
    "pxr-plug-dev==26.8.*",
    "pxr-boost-dev==26.8.*",
]
build-backend = "scikit_build_core.build"

[project]
name = "pxr-kind-dev"
version = "26.8"
description = "C++ headers and CMake config for developing with pxr-kind"
readme = "README.md"
requires-python = ">=3.8"
license-files = ["LICENSE.txt", "NOTICE.txt"]
keywords = ["pixar", "open-usd", "dev"]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows :: Windows 10",
]
dependencies = [
    "pxr-tf-dev==26.8.*",
    "pxr-plug-dev==26.8.*",
    "pxr-boost-dev==26.8.*",
]

[project.urls]
Repository = "https://github.com/untwine/pxr-kind"

[tool.scikit-build]
cmake.version = ">=3.23,<4.3"
cmake.args = [
    "-DBUILD_TESTS=OFF",
    "-DBUILD_SHARED_LIBS=ON",
    "-DBUILD_PYTHON_BINDINGS=ON",
    "-DCMAKE_INSTALL_LIBDIR=pxr-kind/lib",
    "-DCMAKE_INSTALL_BINDIR=pxr-kind/lib",
    "-DCMAKE_INSTALL_INCLUDEDIR=pxr-kind/include",
    "-DCMAKE_INSTALL_DATAROOTDIR=pxr-kind",
    "-DCMAKE_INSTALL_PYTHON_LIBDIR=pxr-kind/lib/python",
]
sdist.exclude = ["test", ".github"]
